---
platform: linux

image_resource:
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: general-task
    aws_region: us-gov-west-1
    tag: latest

inputs:
- name: git-login-migrator-bot

params:
  DB_URI: ((db-uri))
  # S3 bucket that receives the per-query result JSON files. Provided by the
  # pipeline per environment from ci/config.yml — ((uaa-queries-s3-bucket-staging))
  # for staging, ((uaa-queries-s3-bucket-production)) for production.
  S3_BUCKET: ((s3-bucket))

run:
  path: git-login-migrator-bot/ci/uaa-queries.sh
