---
platform: linux

image_resource:
  type: registry-image
  source:
    aws_access_key_id: ((ecr_aws_key))
    aws_secret_access_key: ((ecr_aws_secret))
    repository: general-task
    aws_region: us-gov-west-1
    tag: latest

inputs:
- name: git-login-migrator-bot

params:
  # Reporting S3 bucket whose uaa/ prefix is downloaded and summarized.
  # Production value is ((uaa-queries-s3-bucket-production)) (see ci/config.yml).
  S3_BUCKET: ((s3-bucket))

run:
  path: git-login-migrator-bot/ci/daily-summary.sh
